name: Vibe Stream

on:
  push:
    branches: [ main ]
    paths: [ 'vibe-stream/**', '.github/workflows/vibe-stream.yml' ]
  pull_request:
    paths: [ 'vibe-stream/**', '.github/workflows/vibe-stream.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibe-stream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (tests, lint, APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe-stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-stream-debug-apk
          path: vibe-stream/app/build/outputs/apk/debug/*.apk
      # Signed release APK: only when the signing secrets exist (see vibe-stream/docs/RELEASE.md).
      # Every release must be signed with the same key, otherwise Android refuses the update.
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VIBE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIBE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: skipping the release build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Vibe-Stream.apk"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: vibe-stream-release-apk
          path: ${{ runner.temp }}/Vibe-Stream.apk

  ios:
    name: iOS (tests, unsigned IPA)
    runs-on: macos-15
    defaults:
      run:
        working-directory: vibe-stream/ios
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core logic tests (Swift package)
        run: swift test --package-path VibeCore
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild -project VibeStream.xcodeproj -scheme VibeStream -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60
      - name: Package unsigned IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/VibeStream.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry VibeStream-unsigned.ipa Payload
          ls -la VibeStream-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-stream-unsigned-ipa
          path: vibe-stream/ios/VibeStream-unsigned.ipa
