name: Vibe Stream release

# Push a tag like "v1.5.0" (must equal versionName in vibe-stream/app/build.gradle.kts) to publish a GitHub release
# with the signed APK, update.json (read by the in-app updater) and the unsigned iOS IPA.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.5.0'
        required: true

permissions:
  contents: write

jobs:
  android:
    name: Signed APK and release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe-stream
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag against versionName
        run: |
          NAME=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          echo "versionName=$NAME versionCode=$CODE tag=$TAG"
          [ "v$NAME" = "$TAG" ] || { echo "::error::Tag $TAG does not match versionName $NAME"; exit 1; }
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VIBE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIBE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets missing (VIBE_KEYSTORE_BASE64, VIBE_KEYSTORE_PASSWORD, VIBE_KEY_ALIAS, VIBE_KEY_PASSWORD). See vibe-stream/docs/RELEASE.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Tests and signed APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: APK and update.json
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/Vibe-Stream.apk"
          SHA=$(sha256sum "$RUNNER_TEMP/out/Vibe-Stream.apk" | cut -d' ' -f1)
          python3 - "$RUNNER_TEMP/out/update.json" "$VERSION_CODE" "$VERSION_NAME" "$SHA" <<'PY'
          import json, sys
          out, code, name, sha = sys.argv[1:]
          json.dump({"versionCode": int(code), "versionName": name, "apk": "Vibe-Stream.apk", "sha256": sha,
                     "notes": "See the release notes on GitHub."}, open(out, "w"), indent=2)
          PY
          cat "$RUNNER_TEMP/out/update.json"
          # Release notes = the CHANGELOG section of this version
          awk -v v="## $VERSION_NAME" 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/out/notes.md"
          printf '\n\n**Android / Fire TV:** install `Vibe-Stream.apk`.\n**iPhone / iPad:** `VibeStream-unsigned.ipa` must be signed with your Apple ID (Sideloadly or AltStore), see vibe-stream/ios/README.md.\n' >> "$RUNNER_TEMP/out/notes.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/out"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Vibe-Stream.apk update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" Vibe-Stream.apk update.json --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Vibe Stream $VERSION_NAME" --notes-file notes.md
          fi

  ios:
    name: Unsigned IPA to the release
    needs: android
    runs-on: macos-15
    defaults:
      run:
        working-directory: vibe-stream/ios
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          xcodebuild -project VibeStream.xcodeproj -scheme VibeStream -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/VibeStream.app Payload/
          zip -qry VibeStream-unsigned.ipa Payload
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" VibeStream-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"
